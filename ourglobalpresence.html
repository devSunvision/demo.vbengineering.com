        function LoadMap() {
            var mapOptions = {
                center: new google.maps.LatLng(15.1794, 39.7823),
                zoom: 3,
                mapTypeId: google.maps.MapTypeId.ROADMAP
            };
            var map = new google.maps.Map(document.getElementById("gmap_canvas"), mapOptions);
            for (var i = 0; i < markers.length; i++) {
                var data = markers[i];
                var myLatlng = new google.maps.LatLng(data.lat, data.lng);
                var marker = new google.maps.Marker({
                    position: myLatlng,
                    map: map,
                    title: data.title,
                    icon: "img16/VBmap.png",
                });
                //Attach click event to the marker.
                (function (marker, data) {
                    google.maps.event.addDomListener(marker, "click", function (e) {
                        //google.maps.event.addListener(infoWindow, 'domready', function () {
                        //Create and open InfoWindow.
                        var infoWindow = new google.maps.InfoWindow();
                        //Wrap the content inside an HTML DIV in order to set height and width of InfoWindow.
                        infoWindow.setContent("<div style = 'width:120px;min-height:40px'>" + data.description + "</div>");
                        infoWindow.open(map, marker);
                    });
                })(marker, data);
            }
        }
