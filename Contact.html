        <script type="text/javascript">

            function validatedetails() {
                var exitval = false;
                var rsltcount = 0;
                var msgtext = "";

                //Name Validation  
                var nameval = document.getElementById("txtName").value;
                if (nameval == "") {
                    document.getElementById("lblname").innerHTML = "Name is Required.";
                    rsltcount += 1;
                }

                else {
                    document.getElementById("lblname").innerHTML = " ";
                    rsltcount = rsltcount + 0;
                }
                //Mobile Validation
                var mobileval = document.getElementById("txtmobile").value;
                if (mobileval.length != 0) {
                    if ($("#txtmobile").intlTelInput("isValidNumber")) {
                        $("#lblmobile").html("");
                        rsltcount = rsltcount + 0;
                    }
                    else {
                        $("#lblmobile").html("Mobile number is invalid.");
                        rsltcount += 1;
                    }
                }
                else {
                    $("#lblmobile").html("Mobile number is required.");
                    rsltcount += 1;
                }
                //Email Validation  
                var emailidval = document.getElementById("txtemail").value;
                var emailidrslt = false;
                if (emailidval == "") {
                    //msgtext = msgtext + "\n Email id required.";
                    document.getElementById("lblemail").innerHTML = "Email Id is required.";


                    rsltcount += 1
                }

                else if (emailidval.length > 1) {
                    emailidrslt = checkEmail(document.getElementById("txtemail"));
                    if (emailidrslt == false) {
                        document.getElementById("lblemail").innerHTML = "Invalid Email Id.";

                        rsltcount += 1
                    }
                }
                else {

                    document.getElementById("lblemail").innerHTML = " ";
                    rsltcount = rsltcount + 0;
                }
                //Message Validation  
                var messageval = document.getElementById("txtmessage").value;
                if (messageval.length == "") {

                    document.getElementById("lblmsg").innerHTML = "Message is Required.";

                    rsltcount += 1
                }
                else {
                    document.getElementById("lblmsg").innerHTML = " ";
                    rsltcount = rsltcount + 0;
                }
                if (rsltcount > 0) {
                    focus_requiredfields();
                    exitval = false;
                    event.preventDefault();
                }

                else {
                    document.getElementsByClassName("loader")[0].style.display = 'block';
                    document.getElementById("btnSave").value = "Submitting";
                    exitval = true;
                }
                //alert("resultcount = " + rsltcount +", exitvalue = " + exitval);

                return exitval;

            }
        </script>
