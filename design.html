<script id="vbe-scope-modal-js">(function(){
  var overlay=document.getElementById('scopeModalOverlay');
  var closeBtn=document.getElementById('scopeModalClose');
  if(!overlay)return;
  function openModal(ctx){
    overlay.classList.add('open');
    document.body.style.overflow='hidden';
    // Push URL context as hidden fields when Bitrix form is ready
    if(ctx){
      var tryFill=function(){
        var fields={'utm_country':ctx.country,'utm_service':ctx.service,'utm_industry':ctx.industry,'utm_city':ctx.city,'utm_product':ctx.product,'utm_source_page':ctx.source};
        Object.keys(fields).forEach(function(k){
          if(!fields[k])return;
          var input=overlay.querySelector('input[name="'+k+'"], input[data-b24-name="'+k+'"]');
          if(input){input.value=fields[k]}
        });
      };
      setTimeout(tryFill,1500);
      setTimeout(tryFill,3000);
      setTimeout(tryFill,5000);
    }
    // GA4 event
    if(typeof gtag==='function'){gtag('event','scope_modal_open',{'context':JSON.stringify(ctx||{})});}
  }
  function closeModal(){
    overlay.classList.remove('open');
    document.body.style.overflow='';
  }
  closeBtn&&closeBtn.addEventListener('click',closeModal);
  overlay.addEventListener('click',function(e){if(e.target===overlay)closeModal()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
  // Intercept all Scope Your Plant CTAs
  document.addEventListener('click',function(e){
    var a=e.target.closest('a.nav-cta, a[data-scope-cta]');
    if(!a)return;
    if(!a.hasAttribute('data-scope-cta') && !(a.textContent||'').match(/scope your plant/i))return;
    e.preventDefault();
    // Parse the CTA href query params for context
    var url=a.getAttribute('href')||'';
    var q=url.split('?')[1]||'';
    var ctx={};
    q.split('&').forEach(function(pair){
      var kv=pair.split('=');
      if(kv[0])ctx[kv[0]]=decodeURIComponent(kv[1]||'');
    });
    openModal(ctx);
  });
})();</script> <script async src="https://cdn.bitrix24.in/b14322741/crm/site_button/loader_10_uejvnm.js"></script> <style>#bx-livechat-container,.bx-livechat-container,.b24-widget-button-position-bottom-right{bottom:100px !important}</style> <script id="vbe-linkedin-pill-js">
