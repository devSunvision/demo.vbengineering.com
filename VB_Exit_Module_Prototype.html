<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VB Exit Module · Working Mockup v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF8F4;--blue-deep:#0A2540;--blue-mid:#1B3A6B;--orange:#FF6B35;
 --ink:#22282F;--grey:#6B7480;--line:#E6E2DA;--panel:#FFFFFF;
 --ok:#1E7A4C;--warn:#B8860B;--bad:#B3261E;--pro:#5B2E9E}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.55}
.wrap{max-width:1340px;margin:0 auto;padding:0 24px}.pad{padding-bottom:70px}
header{background:var(--blue-deep);color:#fff}
.brandbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:14px 0 12px}
.brand{display:flex;align-items:center;gap:14px}
.mark{background:#fff;border-radius:10px;padding:7px 11px;display:grid;place-items:center;flex:none}
.mark img{height:46px;display:block}
.brandtx .nm{font-size:15px;font-weight:600;line-height:1.2}
.brandtx .tag{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:#9FB0C4;margin-top:3px}
.appname{border-left:1px solid rgba(255,255,255,.2);padding-left:14px}
.appname .a{font-size:13.5px;font-weight:500}
.appname .b{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#9FB0C4;margin-top:2px}
.ctrl{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding-top:5px}
.box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:6px 12px;display:flex;gap:10px;align-items:center}
.box .k{font-size:9px;color:#9FB0C4;letter-spacing:1.3px;text-transform:uppercase}
.box .v{font-weight:600;font-size:13px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:transparent;color:#9FB0C4;border-radius:7px 7px 0 0;padding:10px 16px;font-size:12.5px;border-bottom:3px solid transparent}
nav button:hover{color:#fff}
nav button.on{background:var(--cream);color:var(--blue-deep);font-weight:600;border-bottom-color:var(--orange)}
button{font-family:inherit;cursor:pointer;border:none;border-radius:7px;font-size:12px;font-weight:500;padding:6px 13px;transition:.14s}
.bo{background:var(--orange);color:#fff}.bo:hover{filter:brightness(1.07)}
.bg{background:#fff;color:var(--blue-deep);border:1px solid var(--line)}.bg:hover{background:#F3F0EA}
.bgh{background:rgba(255,255,255,.11);color:#fff;border:1px solid rgba(255,255,255,.2)}
.bgh:hover{background:rgba(255,255,255,.2)}
.bd{background:var(--blue-deep);color:#fff}
button:disabled{opacity:.34;cursor:not-allowed}
select.role{font-family:inherit;font-size:12.5px;padding:5px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.09);color:#fff}
select.role option{color:var(--ink)}
h2{font-size:17px;font-weight:600;color:var(--blue-deep);margin:26px 0 3px;letter-spacing:-.2px}
h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--orange);color:#fff;font-size:11.5px;font-weight:700;margin-right:9px;vertical-align:2px}
.lede{color:var(--grey);font-size:12.5px;margin-bottom:14px;max-width:920px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
.card>b{font-size:13px;color:var(--blue-deep)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(206px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(345px,1fr))}
table{width:100%;border-collapse:collapse;font-size:12.3px}
th{background:var(--blue-deep);color:#fff;text-align:left;padding:8px 10px;font-weight:500;font-size:10.2px;letter-spacing:.8px;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:#FBFAF7}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.5px}
.p-ok{background:#E3F3EA;color:var(--ok)}.p-run{background:#E6EDF7;color:var(--blue-mid)}
.p-lock{background:#EFECE6;color:var(--grey)}.p-warn{background:#FAF0D8;color:var(--warn)}
.p-bad{background:#FBE6E4;color:var(--bad)}.p-forced{background:#F1E8FA;color:var(--pro)}
.stage{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:var(--panel);overflow:hidden}
.stage.locked{opacity:.55}
.sh{display:flex;align-items:center;gap:14px;padding:13px 17px;cursor:pointer}
.sh:hover{background:#FBFAF7}
.sl{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--grey);flex:none}
.stage.open .sl{background:var(--orange)}.stage.done .sl{background:var(--ok)}
.st{flex:1;min-width:0}.st b{display:block;font-size:13.5px;color:var(--blue-deep);font-weight:600}
.st small{color:var(--grey);font-size:11.2px}
.sb{border-top:1px solid var(--line);padding:15px 17px;background:#FBFAF7;display:none}
.stage.exp .sb{display:block}
.gate{background:#fff;border-left:3px solid var(--orange);padding:9px 13px;border-radius:0 7px 7px 0;margin-bottom:12px;font-size:12px}
.item{display:flex;align-items:flex-start;gap:12px;padding:9px 11px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;font-size:12.3px}
.item.cl{background:#F7FBF9}
.item .c{font-weight:700;color:var(--orange);width:52px;flex:none;font-size:11px;padding-top:1px}
.item .n{flex:1;min-width:0}.item .a{display:flex;gap:5px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.sum{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}
.chip{background:#F2EFE9;border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:10.4px;color:#4A525C}
.chip b{color:var(--blue-deep);font-weight:600}
.chip.w{background:#FAF0D8;border-color:#E8D9AE;color:#7A5C0B}
.chip.b{background:#FBE6E4;border-color:#F0C9C5;color:#7A1C15}
.floor{background:linear-gradient(135deg,#0A2540,#16365E);color:#fff;border-radius:11px;padding:19px 21px;margin-bottom:13px;position:relative;overflow:hidden}
.floor:after{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,107,53,.12)}
.floor .k{font-size:9.5px;letter-spacing:1.7px;text-transform:uppercase;color:#9FB0C4}
.floor .v{font-size:25px;font-weight:700;margin:2px 0 8px;letter-spacing:-.4px}
.floor p{font-size:12.2px;color:#C9D5E2;max-width:680px;position:relative}
.lockrow{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;position:relative}
.lockrow span{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);border-radius:7px;padding:4px 11px;font-size:11.2px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.kpi .k{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--grey)}
.kpi .v{font-size:24px;font-weight:700;color:var(--blue-deep);line-height:1.2;margin-top:3px;letter-spacing:-.5px}
.kpi .d{font-size:11.2px;color:var(--grey)}.kpi.al .v{color:var(--bad)}
.log{font-size:11.6px;max-height:600px;overflow-y:auto}
.log .e{display:grid;grid-template-columns:96px 140px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.log .t{color:var(--grey)}.log .a{font-weight:600;color:var(--blue-mid)}
.modal{position:fixed;inset:0;background:rgba(10,37,64,.6);display:none;place-items:center;z-index:50;padding:20px}
.modal.on{display:grid}
.mb{background:#fff;border-radius:13px;max-width:760px;width:100%;padding:0;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:18px 24px 12px;border-bottom:1px solid var(--line)}
.mh h3{font-size:15.5px;color:var(--blue-deep);font-weight:600}
.mh p{font-size:12.2px;color:var(--grey);margin-top:3px}
.mc{padding:16px 24px;overflow-y:auto;flex:1}
.mf{padding:13px 24px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.mf .lf{margin-right:auto;font-size:11.3px;color:var(--grey)}
textarea,input,select.f{width:100%;font-family:inherit;font-size:12.8px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#FBFAF7;color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:10.5px;font-weight:600;color:var(--blue-deep);margin:11px 0 4px;letter-spacing:.6px;text-transform:uppercase}
label .rq{color:var(--orange)}
.fh{font-size:11.1px;color:var(--grey);margin-top:4px}
.ff{display:grid;gap:0 14px}.ff.c2{grid-template-columns:1fr 1fr}
.wb{background:#FBE6E4;border-left:3px solid var(--bad);padding:10px 13px;border-radius:0 7px 7px 0;font-size:12.1px;color:#7A1C15;margin:9px 0}
.ob{background:#E3F3EA;border-left:3px solid var(--ok);padding:10px 13px;border-radius:0 7px 7px 0;font-size:12.1px;color:#145033;margin:9px 0}
.pb{background:#F1E8FA;border-left:3px solid var(--pro);padding:10px 13px;border-radius:0 7px 7px 0;font-size:12.1px;color:#452070;margin:9px 0}
.yb{background:#FAF0D8;border-left:3px solid var(--warn);padding:10px 13px;border-radius:0 7px 7px 0;font-size:12.1px;color:#6E5309;margin:9px 0}
.carr{background:#F4F8FD;border:1px solid #D9E4F2;border-radius:9px;padding:11px 13px;margin:11px 0}
.carr .t{font-size:9.8px;letter-spacing:1.1px;text-transform:uppercase;color:var(--blue-mid);font-weight:700;margin-bottom:6px}
.carr .r{display:flex;justify-content:space-between;gap:12px;font-size:12.1px;padding:2px 0}
.carr .r span:first-child{color:var(--grey)}
.carr .r span:last-child{font-weight:600;color:var(--blue-deep);text-align:right}
.hint{font-size:11.2px;color:var(--grey);margin-top:4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--blue-deep);color:#fff;padding:11px 19px;border-radius:9px;font-size:12.5px;z-index:80;opacity:0;pointer-events:none;transition:.24s;max-width:80vw;text-align:center}
.toast.on{opacity:1}
.row{display:grid;grid-template-columns:1fr 196px 118px;gap:9px;align-items:center;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fff;font-size:12.2px}
.row.miss{border:1.5px solid var(--bad)}
.grp{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--grey);margin:12px 0 5px;font-weight:600}
.tag{font-size:9.6px;padding:2px 7px;border-radius:5px;background:#EFECE6;color:var(--grey);letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.noaccess{background:#fff;border:1px dashed var(--line);border-radius:11px;padding:28px;text-align:center;color:var(--grey);font-size:12.6px}
.gt-tbl{width:100%;font-size:11.8px;border-collapse:collapse;margin-top:5px}
.gt-tbl th{background:#F2EFE9;color:var(--blue-deep);font-size:9.6px;padding:6px 7px}
.gt-tbl td{padding:4px 5px;border-bottom:1px solid var(--line)}
.gt-tbl input,.gt-tbl select{padding:5px 7px;font-size:11.8px;border-radius:6px}
/* document preview */
.paper{background:#fff;border:1px solid #D8D2C6;border-radius:4px;padding:26px 30px;font-size:12.2px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--blue-deep);padding-bottom:9px;margin-bottom:14px}
.paper .ph .co{font-size:13.5px;font-weight:700;color:var(--blue-deep);letter-spacing:.3px}
.paper .ph .ad{font-size:10px;color:var(--grey);line-height:1.4;margin-top:2px}
.paper .ph .cd{font-size:9.6px;color:var(--grey);text-align:right;line-height:1.5}
.paper h4{font-size:13px;color:var(--blue-deep);text-align:center;margin:4px 0 12px;letter-spacing:.4px;text-transform:uppercase}
.paper .pr{display:grid;grid-template-columns:170px 1fr;gap:3px 10px;font-size:11.9px;margin-bottom:12px}
.paper .pr .k{color:var(--grey)}
.paper .bdy{font-size:12px;line-height:1.65;margin-bottom:12px}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px;font-size:11.4px}
.paper .sig div{border-top:1px solid var(--ink);padding-top:5px;color:var(--grey)}
.paper .pf{border-top:1px solid var(--line);margin-top:20px;padding-top:7px;font-size:9.4px;color:var(--grey);display:flex;justify-content:space-between}
.scroll{overflow-x:auto;padding-bottom:6px}
.swim{min-width:1180px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.swimr{display:grid;grid-template-columns:150px repeat(7,minmax(146px,1fr))}
.swimr.hd{background:var(--blue-deep);color:#fff}
.swimr.hd>div{padding:9px 10px;border-left:1px solid rgba(255,255,255,.13)}
.swimr.hd>div:first-child{border-left:none}
.swimr.hd .t{font-size:11px;font-weight:600;line-height:1.3}
.swimr.hd .s{font-size:9.2px;color:#9FB0C4;letter-spacing:.7px;text-transform:uppercase;margin-top:3px}
.swimr.hd .gt{display:inline-block;background:var(--orange);color:#fff;font-size:8.2px;font-weight:700;letter-spacing:1px;padding:1px 6px;border-radius:4px;margin-bottom:4px}
.lane{border-top:1px solid var(--line)}
.lane>div{padding:8px;border-left:1px solid var(--line);min-height:56px}
.lane>div:first-child{border-left:none;background:#F6F3EE;font-size:10.5px;font-weight:600;color:var(--blue-deep);display:flex;align-items:center;flex-direction:column;justify-content:center;text-align:left;line-height:1.35}
.lane>div:first-child span{display:block;width:100%}
.lane>div:first-child .sub{font-weight:400;color:var(--grey);font-size:9.5px;margin-top:2px}
.lane.sys{background:#F8FAFD}
.nd{background:#fff;border:1px solid var(--line);border-left:3px solid var(--grey);border-radius:6px;padding:5px 8px;margin-bottom:5px;font-size:10.8px;line-height:1.35}
.nd:last-child{margin-bottom:0}
.nd b{display:block;font-size:10px;letter-spacing:.5px;color:var(--orange);font-weight:700;margin-bottom:1px}
.nd.doc{border-left-color:var(--blue-mid)}
.nd.sign{border-left-color:var(--orange);background:#FFF9F6}
.nd.auto{border-left-color:#4E7BB8;background:#F4F8FD}
.nd.act{border-left-color:var(--ok)}
.nd.stop{border-left-color:var(--bad);background:#FDF2F1}
.nd .h{color:var(--grey);font-size:9.9px;margin-top:3px;display:block;line-height:1.35}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--grey);margin:9px 0 0}
.lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rail{position:relative;margin:14px 58px 4px;padding:30px 0 8px}
.rail .bar{height:5px;background:linear-gradient(90deg,#1B3A6B,#1B3A6B 64%,var(--orange) 64%,var(--orange) 76%,#1B3A6B 76%);border-radius:3px}
.rail .mk{position:absolute;top:0;transform:translateX(-50%);text-align:center;width:120px}
.rail .mk .d{font-size:10px;font-weight:700;color:var(--blue-deep)}
.rail .mk .l{font-size:9.6px;color:var(--grey);line-height:1.3}
.rail .mk:after{content:'';position:absolute;left:50%;bottom:-13px;width:2px;height:11px;background:var(--grey);transform:translateX(-50%)}
.rail .mk.hot .d{color:var(--orange)}.rail .mk.hot:after{background:var(--orange);width:3px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .num{width:26px;height:26px;border-radius:8px;background:var(--blue-deep);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.step .who{font-size:9.6px;letter-spacing:1.1px;text-transform:uppercase;color:var(--orange);font-weight:700}
.step .wt{font-size:12.8px;font-weight:600;color:var(--blue-deep);margin:1px 0 3px}
.step .bdy{font-size:12.2px;color:#3D4650}
.step .hn{font-size:11.3px;color:var(--grey);margin-top:5px;padding-left:10px;border-left:2px solid var(--line)}
.calc{width:100%;font-size:12.4px;border-collapse:collapse}
.calc td{padding:6px 4px;border-bottom:1px solid var(--line)}
.calc td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.calc tr.tot td{border-top:2px solid var(--blue-deep);border-bottom:none;font-weight:700;color:var(--blue-deep);font-size:14px;padding-top:9px}
.calc tr.neg td:last-child{color:var(--bad)}
.calc tr.mut td{color:var(--grey);font-size:11.6px}
.secx{grid-column:1/-1;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--orange);
 font-weight:700;margin:18px 0 2px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.xb{background:transparent;color:var(--grey);border:none;font-size:15px;line-height:1;padding:2px 5px;border-radius:5px}
.xb:hover{background:#FBE6E4;color:var(--bad)}
footer{background:var(--blue-deep);color:#8FA1B7;font-size:11.2px;padding:13px 0;margin-top:34px}
footer .fr{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer b{color:#C9D5E2;font-weight:500}
</style>
</head>
<body>
<header><div class="wrap">

const LWD=()=>{const c=S.c;return c&&c.lwd?+pdate(c.lwd):D.today};

const dueD=i=>+addWD(LWD(),STG[i].due);
const settleD=()=>+addWD(LWD(),2);

/* ---------------- gates ---------------- */
function itemsDone(k){return ITEMS[k].every(([c])=>S.stages[k].items[c].state==='closed')}
function extraOK(k){
 if(k==='A')return S.rmSigned&&Object.keys(S.disp).length===LEDGER.length&&S.succAccepted
  &&REPOS.every(r=>S.repos[r.id].act&&S.repos[r.id].conf);
 if(k==='D')return S.card.A&&S.card.B&&S.card.C&&S.card.D;
 return true}
function stDone(k){return S.stages[k].forced||(itemsDone(k)&&extraOK(k))}
function stStatus(i){const s=STG[i];
 if(!S.opened)return 'nocase';
 if(stDone(s.k))return S.stages[s.k].forced?(S.stages[s.k].demo?'demo':'forced'):'done';
 if(i>0&&!stDone(STG[i-1].k))return 'blocked';
 if(S.today<openD(i))return 'notyet';
 if(S.today>dueD(i))return 'overdue';return 'open'}
const canWork=i=>['open','overdue'].includes(stStatus(i));
function roleCanWork(i){const r=ROLES[S.role];
 if(r.approver||r.scoped)return false;
 if(S.role==='HR')return true;
 return STG[i].own===S.role}

/* ---------------- money ---------------- */
function recoveryLines(){
 const out=[];
 ROWS('FI-1','rows').forEach(r=>{if(r.p&&+r.amt>0)out.push({p:r.p,amt:+r.amt,notice:r.notice||'',src:r.src||'entered by Finance'})});
 const f=S.f['FI-2']||{};
 if(+f.sdaAmt>0)out.push({p:'Site Deployment Agreement · '+(f.sdaMon||'?')+' months short of the initial tenure',amt:+f.sdaAmt,notice:f.sdaNotice||'',src:'FI-2'});
 if(+f.bondAmt>0)out.push({p:'Training Cost Recovery Bond · '+(f.bondMon||'?')+' months short of the service period',amt:+f.bondAmt,notice:f.bondNotice||'',src:'FI-2'});
 return out}
function calc(){
 const c=S.c||{};const wage=+c.wage||0;const daily=wage/30;
 const days=+V('FI-4','days')||(c.lwd?pdate(c.lwd).getDate():0);
 const earned=Math.round(daily*days);
 const enc=Math.round(daily*(+c.leaveBal||0));
 const bonus=+V('FI-1','bonusAmt')||0;
 const reimb=+V('FI-1','reimb')||0;
 const gross=earned+enc+bonus;
 const lines=recoveryLines();
 const withN=lines.filter(l=>l.notice),noN=lines.filter(l=>!l.notice);
 const claimed=withN.reduce((a,l)=>a+l.amt,0);
 const blocked=noN.reduce((a,l)=>a+l.amt,0);
 const ceiling=Math.round(gross*0.5);
 const deduct=Math.min(claimed,ceiling);
 const carried=claimed-deduct;
 const net=gross-deduct;
 return{wage,daily,days,earned,enc,bonus,reimb,gross,lines,withN,noN,claimed,blocked,ceiling,deduct,carried,net}}

/* ---------------- clock ---------------- */
function clock(){if(D&&D.cases)D.cases.forEach((_,i)=>withCase(i,clockOne))}
function clockOne(){
 if(!S.opened)return;
 STG.forEach((s,i)=>{const st=S.stages[s.k];if(stDone(s.k))return;
  const ss=stStatus(i);if(['blocked','notyet','nocase'].includes(ss))return;
  const over=Math.floor((S.today-dueD(i))/DAY);
  [[-2,1,'Reminder',s.n],[0,2,'Overdue notice',s.n+' and department head'],
   [1,3,'Escalation','Human Resources'],[3,4,'Escalation','Director Operations']]
   .forEach(([d,l,kind,to])=>{if(over>=d&&st.esc<l){st.esc=l;lg('System',kind,'Stage '+s.k+' · '+s.n+' · to '+to)}})});
 if(!S.settlementPaid&&S.today>=settleD()){S.settlementPaid=true;
  const q=calc();const clean=STG.every(s=>stDone(s.k));
  lg('System','SETTLEMENT INSTRUCTION ISSUED',
   'Gross '+rs(q.gross)+' less deduction '+rs(q.deduct)+' · net '+rs(q.net)
   +' released on the second working day. Chain '+(clean?'complete':'INCOMPLETE · released regardless. No role can hold this'))}
 if(!S.lettersReleased&&STG.every(s=>stDone(s.k))&&S.today>=LWD()){S.lettersReleased=true;
  lg('System','Letters released','Relieving Letter and Experience and Service Certificate released on full clearance')}}
function adv(n){for(let i=0;i<n;i++){S.today+=DAY;clock()}save();render()}

function fldHtml(f,val,idp){
 if(f.t==='sec')return '<div class="secx">'+f.l+'</div>';
 const id=idp+'_'+f.k;
 const lb='<label for="'+id+'">'+f.l+(f.req?' <span class="rq">*</span>':'')+'</label>';
 const h=f.hint?'<div class="fh">'+f.hint+'</div>':'';
 let inp='';
 if(f.t==='ro')inp='<div style="font-size:12.9px;font-weight:600;color:var(--blue-deep);padding:7px 0">'+(val||'not available yet')+'</div>';
 else if(f.t==='ta')inp='<textarea id="'+id+'">'+esc(val||'')+'</textarea>';
 else if(f.t==='sel')inp='<select class="f" id="'+id+'"><option value=""></option>'
   +f.o.map(o=>'<option '+(val===o?'selected':'')+'>'+o+'</option>').join('')+'</select>';
 else if(f.t==='chk')inp='<div style="padding:6px 0"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:12.6px;font-weight:400;color:var(--ink);margin:0">'
   +'<input type="checkbox" id="'+id+'" '+(val?'checked':'')+'> '+(f.cl||'Confirmed')+'</label></div>';
 else if(f.t==='num')inp='<input type="number" id="'+id+'" value="'+esc(val==null?'':val)+'">';
 else if(f.t==='date')inp='<input type="date" id="'+id+'" value="'+esc(val||'')+'">';
 else inp='<input type="text" id="'+id+'" value="'+esc(val||'')+'">';
 return '<div>'+lb+inp+h+'</div>'}

function tabHtml(f,rows,idp,code){
 let h='<label>'+f.l+'</label>'+(f.hint?'<div class="fh" style="margin:0 0 5px">'+f.hint+'</div>':'')
  +'<table class="gt-tbl"><thead><tr>'+f.cols.map(c=>'<th style="'+(c.w?'width:'+c.w:'')+'">'+c.l+'</th>').join('')
  +'<th style="width:26px"></th></tr></thead><tbody>';
 rows.forEach((r,i)=>{h+='<tr>'+f.cols.map(c=>{
  const id=idp+'_'+f.k+'_'+i+'_'+c.k;const v=r[c.k];
  if(c.t==='ro')return '<td style="color:var(--grey);font-size:11.2px">'+esc(v||'')+'</td>';
  if(c.t==='sel')return '<td><select class="f" id="'+id+'"><option value=""></option>'
    +c.o.map(o=>'<option '+(v===o?'selected':'')+'>'+o+'</option>').join('')+'</select></td>';
  if(c.t==='num')return '<td><input type="number" id="'+id+'" value="'+esc(v==null?'':v)+'"></td>';
  if(c.t==='date')return '<td><input type="date" id="'+id+'" value="'+esc(v||'')+'"></td>';
  if(c.t==='chk')return '<td style="text-align:center"><input type="checkbox" id="'+id+'" '+(v?'checked':'')+'></td>';
  return '<td><input type="text" id="'+id+'" value="'+esc(v||'')+'"></td>'}).join('')
  +'<td style="text-align:center"><button class="xb" title="Remove this line" onclick="delRow(\''+code+'\',\''+f.k+'\','+i+')">&times;</button></td></tr>'});
 h+='</tbody></table>';
 h+='<div style="margin-top:6px"><button class="bg" onclick="addRow(\''+code+'\',\''+f.k+'\')">+ Add a line</button>'
  +'<span class="fh" style="display:inline;margin-left:9px">'+rows.length+' line'+(rows.length===1?'':'s')+'. Add as many as the case needs.</span></div>';
 return h}

function readForm(code){
 const F=FORMS[code],idp='ff';const o={};
 F.fields.forEach(f=>{
  if(f.t==='ro'||f.t==='sec')return;
  if(f.t==='tab'){const rows=[];const n=(S.f[code]&&S.f[code][f.k]?S.f[code][f.k].length:0)||curRows(code,f).length;
   for(let i=0;i<n;i++){const r={};f.cols.forEach(c=>{
    if(c.t==='ro'){r[c.k]=(curRows(code,f)[i]||{})[c.k];return}
    const e=document.getElementById(idp+'_'+f.k+'_'+i+'_'+c.k);
    if(!e){const src=curRows(code,f)[i]||{};r[c.k]=src[c.k];return}
    r[c.k]=c.t==='chk'?e.checked:e.value});rows.push(r)}
   o[f.k]=rows;return}
  const e=document.getElementById(idp+'_'+f.k);if(!e)return;
  o[f.k]=f.t==='chk'?e.checked:e.value});
 return o}
function curRows(code,f){
 if(S.f[code]&&S.f[code][f.k])return S.f[code][f.k];
 return f.seed?f.seed():[]}
function addRow(code,k){
 const cur=readForm(code);
 cur[k]=(cur[k]||[]).concat([{}]);S.f[code]=Object.assign({},S.f[code],cur);save();
 if(code==='SETUP'){render();return}formModal(code)}
function delRow(code,k,i){
 const cur=readForm(code);cur[k]=(cur[k]||[]).filter((_,j)=>j!==i);
 S.f[code]=Object.assign({},S.f[code],cur);save();
 if(code==='SETUP'){render();return}formModal(code)}

function formModal(code){
 const F=FORMS[code];const d=S.f[code]||{};
 let h='<div class="mh"><h3>'+code+' · '+F.t+'</h3><p>'+F.p+'</p></div><div class="mc">';
 if(F.note)h+='<div class="'+(F.noteType||'gate')+'">'+(typeof F.note==='function'?F.note():F.note)+'</div>';
 (F.carry?F.carry():[]).forEach(c=>{
  h+='<div class="carr"><div class="t">'+c.t+'</div>'
   +c.rows.map(r=>'<div class="r"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')
   +(c.foot?'<div class="hint" style="margin-top:6px">'+c.foot+'</div>':'')+'</div>'});
 if(F.body)h+=F.body();
 let pair=[];
 const flush=()=>{if(pair.length){h+='<div class="ff c2">'+pair.join('')+'</div>';pair=[]}};
 F.fields.forEach(f=>{
  const val=f.t==='ro'?(f.v?f.v():'') : (d[f.k]!==undefined?d[f.k]:(f.v?f.v():''));
  if(f.t==='tab'){flush();h+=tabHtml(f,curRows(code,f),'ff',code);return}
  if(f.t==='ta'||f.full){flush();h+='<div class="ff">'+fldHtml(f,val,'ff')+'</div>';return}
  pair.push(fldHtml(f,val,'ff'));if(pair.length===2)flush()});
 flush();
 h+='</div><div class="mf"><span class="lf">Nothing is sent anywhere. This page is the whole system.</span>'
  +'<button class="bg" onclick="close_()">Cancel</button>'
  +'<button class="bo" onclick="saveForm(\''+code+'\')">'+(F.btn||'Save and close the item')+'</button></div>';
 open_(h)}

function saveForm(code){
 const F=FORMS[code];const o=readForm(code);
 const miss=F.fields.filter(f=>f.req&&f.t!=='ro'&&f.t!=='tab'&&!o[f.k]);
 if(miss.length){toast('Required: '+miss.map(f=>f.l).join(', '),true);return}
 if(F.check){const e=F.check(o);if(e){toast(e,true);return}}
 S.f[code]=Object.assign({},S.f[code],o);
 const st=stageOf(code);const it=S.stages[st].items[code];
 const kind=ITEMS[st].find(x=>x[0]===code)[2];
 if(kind==='sign'){it.state='gen';lg(ROLES[S.role].label,'Document generated',code+' · '+F.t+' · verification code '+vcode(code))}
 else{it.state='closed';lg(ROLES[S.role].label,'Completed',code+' · '+F.t+(F.logx?' · '+F.logx(o):''))}
 if(F.after)F.after(o);
 close_();clock();save();render();toast(code+(kind==='sign'?' generated · print it next':' saved'))}
function stageOf(code){return Object.keys(ITEMS).find(k=>ITEMS[k].some(x=>x[0]===code))}

function calcHtml(){
 const q=calc();const c=S.c;
 let h='<div class="carr"><div class="t">Computed live from the case</div><table class="calc">'
  +'<tr><td>Monthly gross wage</td><td>'+rs(q.wage)+'</td></tr>'
  +'<tr class="mut"><td>Daily rate, thirty-day month</td><td>'+rs(q.daily)+'</td></tr>'
  +'<tr><td>Earned salary · '+q.days+' days</td><td>'+rs(q.earned)+'</td></tr>'
  +'<tr><td>Leave encashment · '+(c.leaveBal||0)+' days</td><td>'+rs(q.enc)+'</td></tr>'
  +(q.bonus?'<tr><td>Statutory bonus</td><td>'+rs(q.bonus)+'</td></tr>':'')
  +'<tr class="tot"><td>Wages payable</td><td>'+rs(q.gross)+'</td></tr></table>'
  +(q.reimb?'<div class="hint" style="margin-top:6px">Reimbursements of '+rs(q.reimb)+' are not in this figure. They release with the letters, on clearance. Holding a reimbursement is lawful. Holding wages is not.</div>':'')
  +'</div>';
 h+='<div class="carr"><div class="t">Deductions · Section 18</div><table class="calc">';
 if(!q.lines.length)h+='<tr class="mut"><td>Nothing recoverable recorded</td><td>Nil</td></tr>';
 q.withN.forEach(l=>{h+='<tr class="neg"><td>'+esc(l.p)+'<div class="hint">notice issued '+fmt(l.notice)+' · from '+l.src+'</div></td><td>'+rs(l.amt)+'</td></tr>'});
 q.noN.forEach(l=>{h+='<tr class="mut"><td>'+esc(l.p)+'<div class="hint" style="color:var(--bad)">no written notice · cannot be deducted, whatever the merits</div></td><td>excluded</td></tr>'});
 h+='<tr><td>Claimed, with a valid notice</td><td>'+rs(q.claimed)+'</td></tr>'
  +'<tr class="mut"><td>Statutory ceiling · 50 per cent of wages payable</td><td>'+rs(q.ceiling)+'</td></tr>'
  +'<tr class="tot neg"><td>Deduction applied</td><td>'+rs(q.deduct)+'</td></tr></table>'
  +(q.carried>0?'<div class="hint" style="color:var(--bad);margin-top:6px">'+rs(q.carried)+' exceeds the ceiling. It cannot come out of this settlement. It moves to the recovery register and is pursued separately.</div>':'')
  +(q.blocked>0?'<div class="hint" style="color:var(--bad);margin-top:4px">'+rs(q.blocked)+' sits on lines with no written notice. Issue the notices and it becomes deductible. Deduct it now and VB pays interest and a penalty.</div>':'')
  +'</div>';
 h+='<div class="carr" style="background:#0A2540;border-color:#0A2540"><div class="t" style="color:#9FB0C4">Net settlement · payable '+fmt(settleD())+'</div>'
  +'<div style="font-size:27px;font-weight:700;color:#fff;letter-spacing:-.5px">'+rs(q.net)+'</div>'
  +'<div class="hint" style="color:#C9D5E2">Section 17(2) of the Code on Wages · two working days from the last working day. '
  +'Section 56 voids any contract clause to the contrary. This figure issues whether or not the chain is complete.</div></div>';
 return h}

  if(!mine&&canWork(i))h+='<div class="pb">You are acting as '+ROLES[S.role].label+'. This stage belongs to '
   +s.n+'. In the built system a department sees only its own stage.</div>';
  h+='<div class="gate"><b>Gate.</b> '+(i===0?'Case in notice and the open date reached.':'Stage '+STG[i-1].k+' closed.')
   +' Closes when every item below is complete'
   +(s.k==='A'?', every custody row dispositioned, the successor named and accepted, and RM-1 signed and uploaded'
    :s.k==='D'?' and the route card is back with all four stops signed':'')+'.</div>';
  if(s.k==='A')h+=exA(i,mine);

  ITEMS[s.k].forEach(([code,nm,kind])=>{

   else if(kind==='sign'){
    a= it.state==='pending'
     ?'<button class="bg" '+(w?'':'disabled')+' onclick="event.stopPropagation();formModal(\''+code+'\')">Fill and generate</button>'
     : it.state==='gen'
     ?'<button class="bg" onclick="event.stopPropagation();previewModal(\''+code+'\')">Preview</button>'
      +'<button class="bo" '+(w?'':'disabled')+' onclick="event.stopPropagation();markPrinted(\''+code+'\')">Print</button>'
     :'<button class="bg" onclick="event.stopPropagation();previewModal(\''+code+'\')">Preview</button>'
      +'<button class="bo" '+(w?'':'disabled')+' onclick="event.stopPropagation();upModal(\''+code+'\')">Upload signed</button>'}
   else a='<button class="bo" '+(w?'':'disabled')+' onclick="event.stopPropagation();formModal(\''+code+'\')">'
     +(kind==='ro'?'Review and certify':'Fill in')+'</button>';
   const rj=it.rej?' <span class="chip b"><b>'+it.rej+'</b> upload rejected</span>':'';
   const tg=kind==='sign'?' <span class="tag">He signs it</span>':kind==='auto'?' <span class="tag">Automatic</span>'
     :kind==='ro'?' <span class="tag">Assembled</span>':'';
   h+='<div class="item '+(it.state==='closed'?'cl':'')+'"><div class="c">'+code+'</div>'
    +'<div class="n">'+nm+tg+rj+(it.state==='closed'?summ(code):'')
    +(code==='IT-0'?'<div class="hint">External sharing events in the last 30 days · <b>14</b>, against his own 12-month baseline. Evidence hashed, HR alone notified. Access not altered, Reporting Manager not told.</div>':'')
    +'</div><div class="a">'+a+'</div></div>'});

  if(s.k==='E'&&stDone('E'))h+='<div style="margin-top:9px">'
   +(S.soaIssued?'<div class="ob"><b>Statement of Account handed over.</b> In person or by registered post. It was not emailed and not messaged.</div>'
     :'<button class="bo" onclick="event.stopPropagation();previewModal(\'SOA\')">Statement of Account</button>'
      +'<div class="hint">The only document in the case carrying figures. It goes with the settlement, in person or by registered post with acknowledgement due, never by email or message.</div>')+'</div>';
  if(!stDone(s.k))h+='<div style="margin-top:10px"><button class="bg" onclick="event.stopPropagation();forceModal('+i+')">Force advance · Director Operations only</button></div>';
  h+='</div></div>'});
 return h}

function caseSummary(i){
 return withCase(i,()=>{
  const q=calc();
  const idx=STG.findIndex(s=>!stDone(s.k));
  const ss=idx<0?'done':stStatus(idx);
  const overdue=STG.filter((s,j)=>stStatus(j)==='overdue').length;
  const esc_=Math.max.apply(null,STG.map(s=>S.stages[s.k].esc));
  const leak=CLOSURE.filter(r=>!S.closure[r.id]).reduce((a,r)=>a+r.cost,0);
  return{ref:S.ref,name:S.c.name,eid:S.c.eid,desig:S.c.desig,route:S.c.route,
   lwd:S.c.lwd,stage:idx<0?'All closed':'Stage '+STG[idx].k+' · '+STG[idx].n,
   ss,overdue,esc:esc_,net:q.net,settle:settleD(),paid:S.settlementPaid,
   closed:S.caseClosed,letters:S.lettersReleased,leak:S.today>=LWD()?leak:0}})}

function vBoard(){

 h+='</tbody></table></div>'

 +'<div class="card"><b>What is real and what is not</b>'
 +'<p class="hint" style="margin-top:7px"><b>Real.</b> The arithmetic, the gates, the escalation clock, the carry-forward between departments, the document previews, the upload rejection path, the fifty per cent ceiling, the exclusion of a deduction with no written notice.</p>'
 +'<p class="hint" style="margin-top:8px"><b>Not real.</b> No login, no database, no email, no PDF. Uploads are simulated. Refreshing keeps your work; Reset clears it.</p>'
 +'<div class="ob" style="margin-top:10px">The two rules to watch. Every gate blocks. The settlement floor cannot be blocked by anyone, including Director Operations.</div>'
 +'<p class="hint" style="margin-top:9px"><b>Why the Successor sits after the Reporting Manager.</b> He does not exist as a participant until somebody names him, and the person who names him is the Reporting Manager. Until that field is filled, there is nobody to invite. That is also why the system takes the nomination away from the Reporting Manager after two working days and hands it to Human Resources · a case cannot wait on a manager who has not decided.</p></div></div>'}

/* ---------------- render ---------------- */
function render(){
 document.getElementById('today').textContent=fmt(S.today);
 document.getElementById('role').innerHTML=Object.entries(ROLES)
  .map(([k,v])=>'<option value="'+k+'" '+(S.role===k?'selected':'')+'>'+v.label+'</option>').join('');
 const nb=document.getElementById('newbtn');
 if(nb){nb.textContent=S.opened?'+ New exit':'+ Start an exit';
  nb.style.display=(S.role==='HR'&&!D.starting)?'':'none'}
 const cs=document.getElementById('casesel');
 if(cs){const list=openCases();const box=cs.closest?cs.closest('.box'):null;
  if(box)box.style.display=list.length?'':'none';
  cs.innerHTML=D.cases.map((c,i)=>c.opened
   ?'<option value="'+i+'" '+(D.cur===i?'selected':'')+'>'+esc(c.ref+' · '+(c.c.name||''))
     +(c.caseClosed?' · closed':'')+'</option>':'').join('')}
 const tabs=tabsFor();
 if(!tabs.some(t=>t[0]===S.view))S.view='case';
 document.getElementById('nav').innerHTML=tabs.map(([k,l])=>
  '<button class="'+(S.view===k?'on':'')+'" onclick="tab(\''+k+'\')">'+l+'</button>').join('');
 document.getElementById('view').innerHTML=({flow:vFlow,board:vBoard,case:vCase,ledger:vLedger,
  closure:vClosure,log:vLog,about:vAbout})[S.view]()}

load();clock();save();render();

</script>
